# Free preview: saved team edits and battle records can disappear after restart/redeploy.
services:
  - type: web
    name: frontier-battle-lab-web
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FRONTIER_PASSWORD
        sync: false
      - key: FRONTIER_WORKERS
        value: "1"
