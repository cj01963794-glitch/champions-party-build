# Public, password-free preview; saved games are ephemeral on Render Free.
services:
  - type: web
    name: frontier-battle-lab-web
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FRONTIER_WORKERS
        value: "1"
      - key: FRONTIER_DATA
        value: "/var/data"
